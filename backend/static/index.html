<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Grievance Intelligence Command Center</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--navy:#102a43;--blue:#1769aa;--ink:#243b53;--muted:#627d98;--line:#d9e2ec;--bg:#f0f4f8;--card:#fff;--p0:#d64545;--p1:#e67e22;--p2:#d6a700;--p3:#218c74}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 Inter,Segoe UI,system-ui,sans-serif}.top{background:linear-gradient(110deg,#102a43,#164e80);color:#fff;padding:18px 25px;display:flex;gap:25px;align-items:center}.top h1{font-size:21px;margin:0}.top p{margin:3px 0 0;color:#c9dced}.metrics{margin-left:auto;display:flex;gap:10px}.metric{background:#ffffff18;border:1px solid #ffffff26;border-radius:8px;padding:7px 12px;min-width:98px}.metric b{font-size:19px;display:block}.metric span{font-size:11px;color:#d9eaf8}.notice{display:none;padding:9px 18px;background:#fff3cd;color:#765b16;border-bottom:1px solid #ffe69c}.layout{display:grid;grid-template-columns:330px 1fr 360px;height:calc(100vh - 97px);min-height:620px}.panel{background:var(--card);overflow:auto;border-right:1px solid var(--line)}.right{border-left:1px solid var(--line);border-right:0}.panel-head{padding:16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}.panel h2{font-size:16px;margin:0 0 11px}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px}.filters select{grid-column:span 1}.filters select,.form input,.form button{font:inherit;padding:8px;border:1px solid var(--line);border-radius:5px;background:#fff}.queue{padding:10px}.issue{border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:9px;cursor:pointer;transition:.15s}.issue:hover,.issue.active{border-color:#3d8dc9;box-shadow:0 2px 9px #102a4320}.issue-title{font-weight:650;line-height:1.25;margin:6px 0}.tiny{font-size:12px;color:var(--muted)}.chip{font-size:11px;color:#fff;border-radius:12px;padding:3px 7px;font-weight:700}.P0{background:var(--p0)}.P1{background:var(--p1)}.P2{background:var(--p2);color:#38310b}.P3{background:var(--p3)}.badge{background:#e6eef5;padding:2px 6px;border-radius:10px;font-size:11px;float:right}.map-wrap{position:relative}.map-controls{position:absolute;z-index:500;top:12px;left:12px;background:#fff;padding:8px 10px;border-radius:6px;box-shadow:0 2px 8px #0003}#map{height:100%;width:100%}.detail{padding:18px}.empty{color:var(--muted);padding:22px 0;text-align:center}.detail h3{margin:3px 0 7px;font-size:18px}.detail-section{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}.kv{display:grid;grid-template-columns:105px 1fr;gap:7px;font-size:13px}.kv label{color:var(--muted)}.bar-row{margin:9px 0}.bar-label{display:flex;justify-content:space-between;font-size:12px}.bar{height:7px;background:#e8eef4;border-radius:8px;margin-top:4px;overflow:hidden}.bar i{display:block;height:100%;background:#287bb8;border-radius:8px}.report{background:#f7fafc;border-left:3px solid #8aa8c0;padding:8px;margin:6px 0;font-size:13px}.status-actions{display:flex;gap:7px}.status-actions button,.form button{border:0;background:#1769aa;color:white;cursor:pointer}.status-actions button:last-child{background:#218c74}.form{padding:14px;margin-top:18px;border-top:1px solid var(--line)}.form h3{font-size:14px;margin:0 0 9px}.form input{width:100%;margin:4px 0}.coord{display:flex;gap:5px}.form button{margin-top:6px;width:100%}.pin{border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px #0008}.hotspot{border:2px dashed #9c27b0;background:#9c27b033}.leaflet-popup-content{font:13px/1.35 system-ui,sans-serif}@media(max-width:1050px){.layout{grid-template-columns:280px 1fr}.right{position:absolute;right:0;top:97px;bottom:0;width:335px;box-shadow:-3px 0 12px #0002}.metrics{display:none}}@media(max-width:700px){.top{padding:14px}.top p{display:none}.layout{grid-template-columns:1fr;height:auto;min-height:0}.panel{max-height:310px}.map-wrap{height:430px}.right{position:static;width:auto}.notice{font-size:12px}}
  </style>
</head>
<body>
<header class="top"><div><h1>Grievance Intelligence Command Center</h1><p>AI Classification · Duplicate Resolution · Priority · Hotspots</p></div><div class="metrics"><div class="metric"><b id="m-total">—</b><span>Total Complaints</span></div><div class="metric"><b id="m-unique">—</b><span>Unique Issues</span></div><div class="metric"><b id="m-duplicates">—</b><span>Duplicates Collapsed</span></div><div class="metric"><b id="m-p0">—</b><span>Critical P0</span></div><div class="metric"><b id="m-open">—</b><span>Open Issues</span></div></div></header>
<div id="notice" class="notice"></div>
<main class="layout"><aside class="panel"><div class="panel-head"><h2>Officer queue</h2><div class="filters"><select id="priority-filter"><option value="">All priorities</option><option>P0</option><option>P1</option><option>P2</option><option>P3</option></select><select id="status-filter"><option value="">All statuses</option><option>OPEN</option><option>ACK</option><option>IN_PROGRESS</option><option>RESOLVED</option></select><select id="department-filter"><option value="">All departments</option></select></div></div><div id="queue" class="queue"><p class="empty">Loading…</p></div></aside>
<section class="map-wrap"><div class="map-controls"><label><input id="hotspot-toggle" type="checkbox" checked> Hotspots</label></div><div id="map"></div></section>
<aside class="panel right"><div id="detail" class="detail"><p class="empty">Choose an issue from the queue or map.</p></div><form id="complaint-form" class="form"><h3>Live submission</h3><input id="complaint-text" required placeholder="Describe the issue"><div class="coord"><input id="complaint-lat" required type="number" step="any" value="18.5204" aria-label="Latitude"><input id="complaint-lng" required type="number" step="any" value="73.8415" aria-label="Longitude"></div><button type="submit">Submit complaint</button><div id="submission-result" class="tiny"></div></form></aside></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* Change only this value if this static page is hosted separately from FastAPI. */
const API_BASE = "";
const map = L.map('map').setView([18.5204,73.8567],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const markerLayer=L.layerGroup().addTo(map), hotspotLayer=L.layerGroup().addTo(map);let issues=[],selectedId=null;
const $=id=>document.getElementById(id), esc=value=>String(value??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function listOf(payload){return Array.isArray(payload)?payload:(payload?.items||payload?.issues||payload?.data||[])}
async function api(path,opts){const r=await fetch(API_BASE+path,opts);if(!r.ok)throw new Error(`Request failed (${r.status})`);return r.json()}
function alertUser(msg){const n=$('notice');n.textContent=msg;n.style.display=msg?'block':'none'}
function priority(issue){return String(issue.priority_label||'P3').toUpperCase()} function pColor(p){return {P0:'#d64545',P1:'#e67e22',P2:'#d6a700',P3:'#218c74'}[p]||'#218c74'}
function filtered(){const p=$('priority-filter').value,s=$('status-filter').value,d=$('department-filter').value;return issues.filter(x=>(!p||priority(x)===p)&&(!s||String(x.status||'OPEN').toUpperCase()===s)&&(!d||x.department===d)).sort((a,b)=>(b.priority_score||0)-(a.priority_score||0))}
function renderQueue(){const shown=filtered(), q=$('queue');q.innerHTML=shown.length?'':`<p class="empty">No issues match the filters.</p>`;shown.forEach(x=>{const card=document.createElement('article');card.className='issue '+(x.id===selectedId?'active':'');card.innerHTML=`<span class="chip ${priority(x)}">${priority(x)}</span><span class="badge">×${esc(x.report_count||1)}</span><div class="issue-title">#${esc(x.id)} · ${esc(x.summary||x.category_l2||'Untitled issue')}</div><div class="tiny">${esc(x.category_l2)} · ${esc(x.department||'Unassigned')}</div><div class="tiny">${esc(x.ward||'—')} · ${esc(x.status||'OPEN')}</div>`;card.onclick=()=>selectIssue(x.id);q.append(card)})}
function renderMap(hotspots){markerLayer.clearLayers();filtered().forEach(x=>{const count=Math.max(1,Number(x.report_count)||1),size=Math.min(28,14+count*2),p=priority(x);if(!Number.isFinite(+x.lat)||!Number.isFinite(+x.lng))return;const icon=L.divIcon({className:'',iconSize:[size,size],iconAnchor:[size/2,size/2],html:`<div class="pin" style="width:${size}px;height:${size}px;background:${pColor(p)}"></div>`});L.marker([x.lat,x.lng],{icon}).bindTooltip(`#${x.id} ${x.category_l2||''}`).on('click',()=>selectIssue(x.id)).addTo(markerLayer)});hotspotLayer.clearLayers();if($('hotspot-toggle').checked)(hotspots||[]).forEach(h=>{if(!Number.isFinite(+h.center_lat)||!Number.isFinite(+h.center_lng))return;L.circle([h.center_lat,h.center_lng],{radius:180,className:'hotspot',color:'#9c27b0',fillColor:'#9c27b0',fillOpacity:.16}).bindPopup(`<b>${esc(h.category)} hotspot</b><br>z-score: ${esc(h.z_score)}<br>Total reports: ${esc(h.total_reports)}<br>Trend: ${esc(h.trend_pct)}%<br>Mean priority: ${esc(h.mean_priority)}`).addTo(hotspotLayer)})}
function renderDetail(x){if(!x){$('detail').innerHTML='<p class="empty">Choose an issue from the queue or map.</p>';return}const factors=x.factors&&typeof x.factors==='object'?x.factors:{};const reports=Array.isArray(x.complaints)?x.complaints:[];const evidence=Array.isArray(x.dedup_reasons)?x.dedup_reasons:[];const sla=x.sla_hours?`${esc(x.sla_hours)} hours`:esc(x.sla_due||'Not available');$('detail').innerHTML=`<span class="chip ${priority(x)}">${priority(x)} · ${esc(x.priority_score||0)}</span><h3>#${esc(x.id)} ${esc(x.summary||'')}</h3><div class="kv"><label>Category</label><span>${esc(x.category_l1)}/${esc(x.category_l2)}</span><label>Department</label><span>${esc(x.department)}</span><label>Ward</label><span>${esc(x.ward)}</span><label>SLA due</label><span>${sla}</span><label>Reports</label><span>${esc(x.report_count||1)}</span><label>Status</label><span>${esc(x.status||'OPEN')}</span></div><div class="detail-section"><b>Why this priority?</b><p class="tiny">${esc(x.priority_why||'No explanation supplied.')}</p>${Object.entries(factors).map(([k,v])=>`<div class="bar-row"><div class="bar-label"><span>${esc(k.replace('_',' '))}</span><span>${esc(v)}</span></div><div class="bar"><i style="width:${Math.max(0,Math.min(100,(+v||0)*100/30))}%"></i></div></div>`).join('')||'<p class="tiny">Factor details unavailable.</p>'}</div><div class="detail-section"><b>Duplicate evidence</b>${evidence.length?evidence.map(r=>`<div class="report">${esc(r)}</div>`).join(''):'<p class="tiny">No linked-complaint evidence supplied.</p>'}</div><div class="detail-section"><b>Citizen reports</b>${reports.length?reports.map(r=>`<div class="report">${esc(r.text||r)}</div>`).join(''):'<p class="tiny">Complaint text endpoint data unavailable.</p>'}</div><div class="detail-section status-actions"><button onclick="setStatus('ACK')">ACK</button><button onclick="setStatus('IN_PROGRESS')">IN PROGRESS</button><button onclick="setStatus('RESOLVED')">RESOLVED</button></div>`}
async function selectIssue(id){selectedId=id;let issue=issues.find(x=>x.id===id);try{issue=await api(`/issues/${id}`)}catch(_){/* queue payload remains useful */}renderDetail(issue);renderQueue()}
async function setStatus(status){if(selectedId==null)return;try{await api(`/issues/${selectedId}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});await refresh()}catch(_){alertUser('Could not update status. Check that the FastAPI service is running.')}}
function updateMetrics(s){[['m-total','total_complaints'],['m-unique','unique_issues'],['m-duplicates','duplicates_collapsed'],['m-p0','p0'],['m-open','open_issues']].forEach(([id,key])=>$(id).textContent=s?.[key]??'—')}
async function refresh(){try{const [issueData,stats,hotspots]=await Promise.all([api('/issues'),api('/analytics/stats'),api('/analytics/hotspots')]);issues=listOf(issueData);updateMetrics(stats||{});const departments=[...new Set(issues.map(x=>x.department).filter(Boolean))];$('department-filter').innerHTML='<option value="">All departments</option>'+departments.map(d=>`<option>${esc(d)}</option>`).join('');renderQueue();renderMap(listOf(hotspots));if(selectedId!=null)renderDetail(issues.find(x=>x.id===selectedId));alertUser('')}catch(e){alertUser('Waiting for FastAPI at this address. Start the backend, then this dashboard will refresh automatically.')}}
['priority-filter','status-filter','department-filter'].forEach(id=>$(id).onchange=()=>{renderQueue();renderMap([])});$('hotspot-toggle').onchange=refresh;$('complaint-form').onsubmit=async e=>{e.preventDefault();const payload={text:$('complaint-text').value,lat:+$('complaint-lat').value,lng:+$('complaint-lng').value};try{const result=await api('/complaints',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});$('submission-result').textContent=`Ticket ${result.ticket_id??result.id??'created'} · issue ${result.issue_id??'pending'} · ${result.decision??result.dedup?.decision??'submitted'}`;$('complaint-text').value='';await refresh()}catch(_){$('submission-result').textContent='Submission failed: FastAPI is not available.'}};refresh();setInterval(refresh,3000);
</script></body></html>
